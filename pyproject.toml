[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specgraph"
version = "0.1.0"
description = "Project-level temporal spec graph with AST-driven belief governance for coding agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "neo4j>=5.14,<6",
]

[project.scripts]
specgraph = "specgraph.cli:main"

[tool.setuptools.packages.find]
include = ["specgraph*"]
